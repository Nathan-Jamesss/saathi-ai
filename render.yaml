services:
  - type: web
    name: saathi-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEYS
        sync: false            # set in Render dashboard (secret)
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma
      - key: DATABASE_URL
        sync: false            # set in Render dashboard — Postgres connection string
      - key: JWT_SECRET
        sync: false            # set in Render dashboard (secret, long random value)
      - key: ADMIN_EMAIL
        sync: false            # set in Render dashboard — used once by create_admin.py
      - key: ADMIN_PASSWORD
        sync: false            # set in Render dashboard — used once by create_admin.py
      - key: GOOGLE_CLIENT_ID
        sync: false            # OAuth client for Google Docs notes (optional feature)
      - key: GOOGLE_CLIENT_SECRET
        sync: false            # OAuth client secret — set in Render dashboard
      - key: GOOGLE_REDIRECT_URI
        value: https://saathi-ai-hfqi.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        value: https://frontend-vert-ten-18.vercel.app
      - key: PYTHON_VERSION
        value: "3.11"
