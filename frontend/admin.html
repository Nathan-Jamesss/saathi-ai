<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saathi.AI · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="dash-page">
  <div class="dash-header">
    <h1>Admin</h1>
    <button id="logout-btn" class="btn btn-ghost">Log out</button>
  </div>

  <div class="dash-section">
    <h2>Add teacher</h2>
    <form id="add-teacher-form" class="card" style="max-width: 400px;">
      <div class="auth-field">
        <label for="new-name">Name</label>
        <input type="text" id="new-name" required />
      </div>
      <div class="auth-field">
        <label for="new-email">Email</label>
        <input type="email" id="new-email" required />
      </div>
      <div class="auth-field">
        <label for="new-password">Password</label>
        <input type="password" id="new-password" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Add teacher</button>
      <div class="auth-error" id="add-error"></div>
    </form>
  </div>

  <div class="dash-section">
    <h2>Teachers</h2>
    <div class="teacher-list" id="teacher-list">
      <div class="history-empty">Loading…</div>
    </div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
