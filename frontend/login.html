<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saathi.AI · Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card card">
    <h1>Log in to Saathi.AI</h1>
    <form id="login-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Log in</button>
      <div class="auth-error" id="error"></div>
    </form>
    <div class="auth-switch">
      No account? <a href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<script type="module">
  import { login, getRole } from './js/auth.js';

  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
      await login({ email, password });
      location.href = getRole() === 'admin' ? 'admin.html' : 'dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
